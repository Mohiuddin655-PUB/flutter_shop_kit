name: flutter_shop_kit
description: "An in-app shop for virtual currency: balance, owned items, six kinds of passes and bundles, bought offline too, priced from a remote catalog with sales and buying limits. Backend-agnostic, with Firestore rules."
version: 0.9.0
repository: https://github.com/Mohiuddin655-PUB/flutter_shop_kit
issue_tracker: https://github.com/Mohiuddin655-PUB/flutter_shop_kit/issues
topics: [shop, wallet, in-app-purchase, offline, firestore]

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Items with a sale, and one owned
    path: doc/images/items.png
  - description: Passes, bought offline
    path: doc/images/passes_offline.png
  - description: A bundle of an item and passes
    path: doc/images/bundles.png
  - description: The ledger as a history
    path: doc/images/history.png
  - description: How it fits together
    path: doc/images/architecture.png
  - description: How it caches
    path: doc/images/caching.png
