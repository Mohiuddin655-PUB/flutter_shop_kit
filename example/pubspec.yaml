name: flutter_shop_kit_example
description: "A small shop on flutter_shop_kit: a balance, items, passes and a bundle, offline too, on a wallet kept in memory."
publish_to: 'none'

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_shop_kit:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
